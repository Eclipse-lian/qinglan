<script>
window.__T = function (k) {
  var m = (window.QL_I18N || {})[k];
  if (!m) return k;
  var l = localStorage.getItem('ql-lang') || 'zh-CN';
  return (m[l] != null) ? m[l] : (m.en != null ? m.en : (m['zh-CN'] != null ? m['zh-CN'] : k));
};
(function () {
  var area = document.getElementById('tsArea');
  function count() {
    var s = area.value;
    var chars = s.length;
    var trimmed = s.trim();
    var lines = trimmed ? s.split(/\n/).length : 0;
    var paras = trimmed ? s.split(/\n\s*\n/).filter(function (b) { return b.trim(); }).length : 0;
    var cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
    var latin = (s.match(/[A-Za-z0-9]+/g) || []).reduce(function (a, b) { return a + b.length; }, 0);
    var words = cjk + latin;
    document.getElementById('tsChars').textContent = chars;
    document.getElementById('tsWords').textContent = words;
    document.getElementById('tsLines').textContent = lines;
    document.getElementById('tsParas').textContent = paras;
  }
  area.addEventListener('input', count);
  count();
})();
</script>
