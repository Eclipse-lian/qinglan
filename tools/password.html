<script>
window.__T = function (k) {
  var m = (window.QL_I18N || {})[k];
  if (!m) return k;
  var l = localStorage.getItem('ql-lang') || 'zh-CN';
  return (m[l] != null) ? m[l] : (m.en != null ? m.en : (m['zh-CN'] != null ? m['zh-CN'] : k));
};
(function () {
  var out = document.getElementById('pwOut');
  function gen() {
    var len = parseInt(document.getElementById('pwLen').value, 10) || 16;
    var sets = [];
    if (document.getElementById('pwUpper').checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    if (document.getElementById('pwLower').checked) sets.push('abcdefghijklmnopqrstuvwxyz');
    if (document.getElementById('pwDigit').checked) sets.push('0123456789');
    if (document.getElementById('pwSymb').checked) sets.push('!@#$%^&*()-_=+[]{};:,.?');
    if (!sets.length) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    var pool = sets.join('');
    var result = '';
    for (var i = 0; i < len; i++) result += pool.charAt(Math.floor(Math.random() * pool.length));
    out.textContent = result;
    meter(len, sets.length);
  }
  function meter(len, kinds) {
    var score = 0;
    if (len >= 8) score++; if (len >= 12) score++; if (len >= 16) score++;
    if (kinds >= 2) score++; if (kinds >= 3) score++; if (kinds >= 4) score++;
    var fill = document.getElementById('pwFill'), cap = document.getElementById('pwCap');
    var label = score >= 6 ? 'pw.sexcel' : score >= 4 ? 'pw.sstrong' : score >= 2 ? 'pw.smid' : 'pw.sweak';
    var pct = Math.min(100, score * 16.6);
    fill.style.width = pct + '%';
    fill.style.background = score >= 6 ? '#3db5ad' : score >= 4 ? '#58c9c0' : score >= 2 ? '#d3b96a' : '#e77b7b';
    cap.textContent = window.__T('pw.strength') + '：' + window.__T(label);
  }
  function copy() {
    var s = out.textContent;
    var msg = document.getElementById('pwMsg');
    var done = function () { msg.textContent = window.__T('pw.copied'); setTimeout(function () { msg.textContent = ''; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done);
    else { var ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(ta); }
  }
  document.getElementById('pwGen').addEventListener('click', gen);
  document.getElementById('pwCopy').addEventListener('click', copy);
  gen();
})();
</script>
