<script>
window.__T = function (k) {
  var m = (window.QL_I18N || {})[k];
  if (!m) return k;
  var l = localStorage.getItem('ql-lang') || 'zh-CN';
  return (m[l] != null) ? m[l] : (m.en != null ? m.en : (m['zh-CN'] != null ? m['zh-CN'] : k));
};
(function () {
  var KEY = 'ql-editor-v1';
  var ta = document.getElementById('edArea');
  var msg = document.getElementById('edMsg');
  function status(k) { msg.textContent = window.__T(k); setTimeout(function () { msg.textContent = ''; }, 1500); }
  try { var saved = localStorage.getItem(KEY); if (saved != null) ta.value = saved; } catch (e) {}
  var t;
  ta.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      try { localStorage.setItem(KEY, ta.value); status('ed.save'); } catch (e) {}
    }, 300);
    stats();
  });
  function dl(ext, mime) {
    var content = ta.value;
    var blob = new Blob([content], { type: mime + ';charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'qinglan-editor-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
    status('ed.done');
  }
  function stats() {
    var v = ta.value;
    document.getElementById('edChars').textContent = v.length;
    document.getElementById('edLines').textContent = v ? v.split('\n').length : 0;
  }
  document.getElementById('edHtml').addEventListener('click', function () { dl('html', 'text/html'); });
  document.getElementById('edTxt').addEventListener('click', function () { dl('txt', 'text/plain'); });
  document.getElementById('edLog').addEventListener('click', function () { dl('log', 'text/plain'); });
  document.getElementById('edClear').addEventListener('click', function () { ta.value = ''; try { localStorage.setItem(KEY, ''); } catch (e) {} stats(); });
  stats();
})();
</script>
