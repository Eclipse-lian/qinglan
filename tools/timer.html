<script>
window.__T = function (k) {
  var m = (window.QL_I18N || {})[k];
  if (!m) return k;
  var l = localStorage.getItem('ql-lang') || 'zh-CN';
  return (m[l] != null) ? m[l] : (m.en != null ? m.en : (m['zh-CN'] != null ? m['zh-CN'] : k));
};
(function () {
  var total = 25 * 60, left = total, timer = null, running = false;
  var timeEl = document.getElementById('tmTime'), tagEl = document.getElementById('tmTag'),
      btn = document.getElementById('tmStart'), minEl = document.getElementById('tmMin'), secEl = document.getElementById('tmSec');
  function fmt(s) {
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function render() { timeEl.textContent = fmt(Math.max(0, left)); }
  function setTag(tag) { tagEl.textContent = tag ? window.__T(tag) : ''; }
  function stop() { if (timer) { clearInterval(timer); timer = null; } running = false; btn.textContent = window.__T('tm.start'); }
  function start() {
    if (running) { stop(); return; }
    if (left <= 0) { readInput(); }
    running = true; btn.textContent = window.__T('tm.pause');
    timer = setInterval(function () {
      left--;
      render();
      if (left <= 0) { stop(); setTag(''); timeEl.textContent = window.__T('tm.done'); }
    }, 1000);
  }
  function readInput() {
    var m = parseInt(minEl.value, 10) || 0, s = parseInt(secEl.value, 10) || 0;
    left = m * 60 + s; total = left; render(); setTag('');
  }
  function reset() { stop(); readInput(); }
  document.getElementById('tmStart').addEventListener('click', start);
  document.getElementById('tmReset').addEventListener('click', reset);
  var presets = document.querySelectorAll('.tm-presets button');
  for (var i = 0; i < presets.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        stop();
        minEl.value = b.getAttribute('data-min');
        secEl.value = 0;
        left = parseInt(b.getAttribute('data-min'), 10) * 60;
        total = left; render(); setTag(b.getAttribute('data-tag'));
      });
    })(presets[i]);
  }
  minEl.addEventListener('input', function () { if (!running) readInput(); });
  secEl.addEventListener('input', function () { if (!running) readInput(); });
  render();
})();
</script>
