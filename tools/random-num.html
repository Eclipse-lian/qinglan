<script>
window.__T = function (k) {
  var m = (window.QL_I18N || {})[k];
  if (!m) return k;
  var l = localStorage.getItem('ql-lang') || 'zh-CN';
  return (m[l] != null) ? m[l] : (m.en != null ? m.en : (m['zh-CN'] != null ? m['zh-CN'] : k));
};
(function () {
  var listEl = document.getElementById('rList');
  function gen() {
    var min = parseFloat(document.getElementById('rmin').value);
    var max = parseFloat(document.getElementById('rmax').value);
    var count = parseInt(document.getElementById('rcount').value, 10);
    var type = document.getElementById('rtype').value;
    var places = parseInt(document.getElementById('rplaces').value, 10);
    if (min > max) { var t = min; min = max; max = t; }
    if (!count || count < 1) count = 1;
    if (count > 500) count = 500;
    var allowDup = document.getElementById('rdup').checked;
    var out = [], seen = {};
    if (!allowDup && type === 'int') {
      var lo = Math.ceil(min), hi = Math.floor(max), pool = [];
      if (hi < lo) hi = lo;
      for (var v = lo; v <= hi; v++) pool.push(v);
      if (count > pool.length) count = pool.length;
      for (var i = 0; i < count; i++) {
        var j = i + Math.floor(Math.random() * (pool.length - i));
        var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        out.push(pool[i]);
      }
    } else if (!allowDup) {
      var tries = 0, maxTries = count * 40 + 200;
      while (out.length < count && tries < maxTries) {
        tries++;
        var r2 = Number((min + Math.random() * (max - min)).toFixed(places));
        var key = r2.toString();
        if (!seen[key]) { seen[key] = 1; out.push(r2); }
      }
    } else {
      for (var k = 0; k < count; k++) {
        var r3 = min + Math.random() * (max - min);
        out.push(type === 'int' ? Math.round(r3) : Number(r3.toFixed(places)));
      }
    }
    var s = out.join('  ');
    listEl.textContent = s;
    return s;
  }
  function copy() {
    var s = listEl.textContent;
    if (!s) { document.getElementById('rMsg').textContent = window.__T('r.empty'); return; }
    var done = function () {
      document.getElementById('rMsg').textContent = window.__T('r.copied');
      setTimeout(function () { document.getElementById('rMsg').textContent = ''; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(done); }
    else {
      var ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }
  document.getElementById('genBtn').addEventListener('click', gen);
  document.getElementById('copyBtn').addEventListener('click', copy);
  document.getElementById('copyBtn2').addEventListener('click', copy);
  gen();
})();
</script>
